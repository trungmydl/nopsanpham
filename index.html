<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Nộp Bài Học Sinh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4 text-slate-800">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-5 sm:p-6 border border-slate-200">
        <div class="text-center mb-5">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h1 class="text-xl font-extrabold text-blue-700">CỔNG NỘP BÀI TẬP</h1>
            <p class="text-xs text-slate-500 mt-1">Tải song song siêu tốc độ, nộp 10 ảnh chỉ mất 3 giây</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">CHỌN LỚP HỌC</label>
                <select id="stuClass" onchange="onClassChange()" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Đang nạp danh sách lớp... --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">CHỌN BÀI TẬP CẦN NỘP</label>
                <select id="stuFolder" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Vui lòng chọn lớp trước --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">HỌ VÀ TÊN HỌC SINH</label>
                <input type="text" id="stuName" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ví dụ: Nguyễn Văn An">
            </div>

            <div class="border-2 border-dashed border-blue-400 bg-blue-50/60 rounded-xl p-4 text-center hover:bg-blue-50 transition cursor-pointer">
                <label for="cameraInput" class="cursor-pointer block">
                    <i class="fa-solid fa-camera-retro text-3xl text-blue-600 mb-1"></i>
                    <p class="text-sm font-bold text-blue-700">Chụp ảnh hoặc Chọn từ thư viện</p>
                    <p class="text-xs text-slate-500 mt-0.5">Chọn cùng lúc 5 - 10 ảnh thoải mái</p>
                </label>
                <input type="file" id="cameraInput" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)">
            </div>

            <div id="previewBox" class="hidden">
                <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-2">
                    <span>Ảnh sẵn sàng gửi (<span id="photoCount">0</span>)</span>
                    <button onclick="clearAllPhotos()" class="text-red-500 hover:underline">Xóa hết</button>
                </div>
                <div id="photoGrid" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-slate-50 rounded-lg border"></div>
            </div>

            <button onclick="submitHomeworkFast()" id="btnSubmit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition disabled:bg-slate-300 flex items-center justify-center gap-2">
                <span>NỘP BÀI NGAY</span>
            </button>

            <div id="statusMsg" class="text-center text-xs font-medium min-h-[1.25rem]"></div>
        </div>
    </div>

    <script>
        // URL Web App triển khai từ Apps Script của bạn[cite: 1]
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnoYmyoxYS15mpMESQ88gu4XudFOeqLm3jlBSs_mGEtZ2Vj8vlyHPDDn1_m90oUgWibg/exec";

        let studentConfigData = [];
        let photoQueue = [];

        function loadStudentConfig() {
            fetch(`${SCRIPT_URL}?action=getStudentConfig&t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(res => {
                    if (res.status !== 'success') return;
                    studentConfigData = res.data;
                    const stuClass = document.getElementById('stuClass');
                    stuClass.innerHTML = '<option value="">-- Chọn lớp học --</option>';

                    const uniqueClasses = [...new Set(studentConfigData.map(item => item.className))];
                    uniqueClasses.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        stuClass.appendChild(opt);
                    });
                })
                .catch(() => {
                    document.getElementById('statusMsg').innerHTML = "<span class='text-red-500'>Lỗi tải danh mục lớp!</span>";
                });
        }

        function onClassChange() {
            const selectedClass = document.getElementById('stuClass').value;
            const folderSelect = document.getElementById('stuFolder');
            folderSelect.innerHTML = '<option value="">-- Chọn bài tập cần nộp --</option>';

            const filtered = studentConfigData.filter(i => i.className === selectedClass);
            filtered.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.folderId;
                opt.textContent = item.folderName;
                opt.dataset.foldername = item.folderName;
                folderSelect.appendChild(opt);
            });
        }

        // Nén ảnh canvas siêu nhẹ (~90KB - 120KB) nhưng chữ viết vẫn sắc nét
        function compressImage(file, maxWidth = 1200, quality = 0.68) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxWidth) {
                            h = Math.round((h * maxWidth) / w);
                            w = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1] });
                    };
                    img.onerror = err => reject(err);
                };
                reader.onerror = err => reject(err);
            });
        }

        async function handleFileSelect(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerHTML = "<span class='text-blue-500 font-semibold'>Đang tối ưu & nén ảnh...</span>";

            const tasks = Array.from(files).map(async (file, i) => {
                const compressed = await compressImage(file);
                return {
                    name: file.name || `Trang_${photoQueue.length + i + 1}.jpg`,
                    base64: compressed.base64,
                    dataUrl: compressed.dataUrl
                };
            });

            const compressedFiles = await Promise.all(tasks);
            photoQueue.push(...compressedFiles);

            document.getElementById('cameraInput').value = "";
            statusMsg.innerText = "";
            renderPhotoGrid();
        }

        function renderPhotoGrid() {
            const box = document.getElementById('previewBox');
            const grid = document.getElementById('photoGrid');
            const count = document.getElementById('photoCount');

            if (photoQueue.length === 0) {
                box.classList.add('hidden');
                return;
            }

            box.classList.remove('hidden');
            count.innerText = photoQueue.length;
            grid.innerHTML = "";

            photoQueue.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "relative rounded border overflow-hidden bg-white shadow-sm";
                div.innerHTML = `
                    <img src="${item.dataUrl}" class="w-full h-20 object-cover">
                    <button onclick="removePhoto(${idx})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">✕</button>
                    <div class="text-[10px] text-center truncate px-1 py-0.5 bg-slate-50 font-medium">Ảnh ${idx + 1}</div>
                `;
                grid.appendChild(div);
            });
        }

        function removePhoto(idx) {
            photoQueue.splice(idx, 1);
            renderPhotoGrid();
        }

        function clearAllPhotos() {
            photoQueue = [];
            renderPhotoGrid();
        }

        // TẢI SONG SONG TOÀN BỘ ẢNH LÊN CÙNG LÚC
        async function submitHomeworkFast() {
            const stuClass = document.getElementById('stuClass').value;
            const folderSelect = document.getElementById('stuFolder');
            const folderId = folderSelect.value;
            const folderName = folderSelect.options[folderSelect.selectedIndex]?.dataset.foldername || "";
            const stuName = document.getElementById('stuName').value.trim();
            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('statusMsg');

            if (!stuClass) return alert("Em nhớ chọn Lớp học nhé!");
            if (!folderId) return alert("Em hãy chọn Bài tập cần nộp!");
            if (!stuName) return alert("Em nhớ điền Họ và Tên!");
            if (photoQueue.length === 0) return alert("Em chưa chụp hoặc chọn ảnh bài làm!");

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-bolt fa-spin"></i> <span>Đang nộp tốc độ cao...</span>`;
            msg.innerHTML = `<span class="text-blue-600 font-semibold">Đang đồng loạt gửi ${photoQueue.length} ảnh lên Drive...</span>`;

            try {
                // Tạo các luồng upload song song cùng lúc
                const uploadPromises = photoQueue.map((item, idx) => {
                    const payload = {
                        action: "uploadSingleFileFast",
                        folderId: folderId,
                        name: stuName,
                        index: idx + 1,
                        total: photoQueue.length,
                        base64Data: item.base64,
                        mimeType: 'image/jpeg'
                    };

                    return fetch(SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    })
                    .then(r => r.json())
                    .then(res => res.status === "success" ? res.fileId : null);
                });

                // Chờ tất cả ảnh hoàn tất cùng 1 lượt
                const results = await Promise.all(uploadPromises);
                const successfulFileIds = results.filter(id => id !== null);

                if (successfulFileIds.length > 0) {
                    // Ghi nhận dòng duy nhất vào Sheet
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "recordStudentSubmission",
                            className: stuClass,
                            folderName: folderName,
                            name: stuName,
                            fileIds: successfulFileIds
                        })
                    });

                    msg.innerHTML = `<span class="text-emerald-600 font-bold text-sm">✅ Đã nộp siêu tốc thành công ${successfulFileIds.length} ảnh bài làm!</span>`;
                    clearAllPhotos();
                    document.getElementById('stuName').value = "";
                } else {
                    msg.innerHTML = `<span class="text-red-600 font-bold">⚠️ Có lỗi trong quá trình tải ảnh, em kiểm tra lại nhé!</span>`;
                }
            } catch (e) {
                msg.innerHTML = `<span class="text-red-600 font-bold">⚠️ Mạng gián đoạn, em bấm nộp lại nhé!</span>`;
            }

            btn.disabled = false;
            btn.innerHTML = `<span>NỘP BÀI NGAY</span>`;
        }

        window.onload = loadStudentConfig;
    </script>
</body>
</html>
