<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nộp Bài Tập Toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-blue-600 mb-6 text-center">Hệ Thống Nộp Bài</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Chọn Lớp</label>
                <select id="className" class="mt-1 block w-full border border-gray-300 rounded-md p-2 bg-white">
                    <option value="">-- Bấm để chọn lớp --</option>
                    <option value="LỚP 11B1">LỚP 11B1</option>
                    <option value="LỚP 11C1">LỚP 11C1</option>
                    <option value="LỚP 11C4">LỚP 11C4</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Họ và Tên học sinh</label>
                <input type="text" id="name" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Ví dụ: Nguyễn Văn A">
            </div>

            <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center">
                <label for="file" class="cursor-pointer text-blue-600 font-medium hover:text-blue-800">
                    📸 Bấm vào đây để thêm ảnh bài làm
                </label>
                <input type="file" id="file" accept="image/*" class="hidden" multiple onchange="handleFileSelect(event)">
                <p class="text-xs text-gray-500 mt-2">* Chụp từng tấm hoặc chọn nhiều tấm đều được.</p>
            </div>

            <div id="previewArea" class="hidden">
                <p class="text-sm font-medium text-gray-700 mb-2">Ảnh đã chọn (<span id="photoCount">0</span>):</p>
                <ul id="photoList" class="space-y-2 max-h-48 overflow-y-auto bg-gray-50 p-2 rounded-md border border-gray-200">
                    </ul>
            </div>

            <button onclick="upload()" id="btn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition">
                NỘP BÀI NGAY
            </button>
            
            <p id="msg" class="text-center text-sm mt-2 font-medium"></p>
        </div>
    </div>

    <script>
        // Mảng toàn cục để lưu trữ các ảnh học sinh chọn
        let photoQueue = [];

        // Hàm nén ảnh
        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl.split(',')[1]); // Trả về base64
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        // Xử lý khi học sinh chọn ảnh
        async function handleFileSelect(event) {
            const files = event.target.files;
            if(files.length === 0) return;

            document.getElementById('msg').innerHTML = "<span class='text-blue-500'>Đang xử lý ảnh...</span>";
            
            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                let base64 = await compressImage(file, 1200, 1200, 0.8);
                
                photoQueue.push({
                    fileName: file.name || `Anh_${photoQueue.length + 1}.jpg`,
                    base64Data: base64
                });
            }

            document.getElementById('file').value = ""; // Reset ô input để có thể chọn lại ảnh vừa chọn
            document.getElementById('msg').innerText = "";
            renderPhotoList();
        }

        // Xóa 1 ảnh khỏi danh sách
        function removePhoto(index) {
            photoQueue.splice(index, 1);
            renderPhotoList();
        }

        // Hiển thị danh sách ảnh
        function renderPhotoList() {
            const previewArea = document.getElementById('previewArea');
            const photoList = document.getElementById('photoList');
            const photoCount = document.getElementById('photoCount');

            if (photoQueue.length === 0) {
                previewArea.classList.add('hidden');
                return;
            }

            previewArea.classList.remove('hidden');
            photoCount.innerText = photoQueue.length;
            photoList.innerHTML = "";

            photoQueue.forEach((photo, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center text-sm bg-white p-2 rounded border";
                li.innerHTML = `
                    <span class="truncate w-3/4 text-gray-600">Ảnh ${index + 1}</span>
                    <button onclick="removePhoto(${index})" class="text-red-500 hover:text-red-700 font-bold px-2">X</button>
                `;
                photoList.appendChild(li);
            });
        }

        // DÁN URL ỨNG DỤNG WEB CỦA THẦY VÀO ĐÂY
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwnoYmyoxYS15mpMESQ88gu4XudFOeqLm3jlBSs_mGEtZ2Vj8vlyHPDDn1_m90oUgWibg/exec";

        async function upload() {
            const className = document.getElementById('className').value;
            const name = document.getElementById('name').value.trim();
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');

            if (!className) { alert("Em nhớ chọn Lớp nhé!"); return; }
            if (!name) { alert("Thầy nhắc em nhập tên nhé!"); return; }
            if (photoQueue.length === 0) { alert("Em chưa chọn ảnh bài làm kìa!"); return; }

            btn.disabled = true;
            let totalFiles = photoQueue.length;
            let successCount = 0;

            for (let i = 0; i < totalFiles; i++) {
                msg.innerHTML = `<span class='text-blue-600'>Đang nộp ảnh ${i + 1}/${totalFiles}... Xin vui lòng đợi!</span>`;
                
                let photo = photoQueue[i];
                const payload = {
                    className: className,
                    name: name,
                    base64Data: photo.base64Data,
                    fileName: `Anh_${i+1}.jpg`, 
                    mimeType: 'image/jpeg'
                };

                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if (result.result === "success") {
                        successCount++;
                    }
                } catch (err) {
                    console.error("Lỗi:", err);
                }
            }

            if (successCount === totalFiles) {
                msg.innerHTML = `<span class='text-green-600 font-bold'>✅ Đã nộp thành công ${totalFiles} ảnh!</span>`;
                photoQueue = []; // Xóa danh sách sau khi nộp
                renderPhotoList();
                document.getElementById('name').value = ""; // Xóa tên để nộp cho người khác nếu mượn máy
            } else {
                msg.innerHTML = `<span class='text-red-600 font-bold'>⚠️ Nộp được ${successCount}/${totalFiles} ảnh. Em kiểm tra lại mạng nhé!</span>`;
            }
            btn.disabled = false;
            btn.innerText = "NỘP BÀI NGAY";
        }
    </script>
</body>
</html>
