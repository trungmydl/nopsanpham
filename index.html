<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Nộp Bài Học Sinh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4 text-slate-800">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-5 sm:p-6 border border-slate-200">
        <div class="text-center mb-5">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                <i class="fa-solid fa-camera"></i>
            </div>
            <h1 class="text-xl font-extrabold text-blue-700">CỔNG NỘP BÀI TẬP</h1>
            <p class="text-xs text-slate-500 mt-1">Ảnh tự động nén siêu nhẹ, tải nhanh dù mạng yếu</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">CHỌN LỚP HỌC</label>
                <select id="stuClass" onchange="onClassChange()" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Đang nạp danh sách lớp... --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">CHỌN BÀI TẬP CẦN NỘP</label>
                <select id="stuFolder" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Vui lòng chọn lớp trước --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">HỌ VÀ TÊN HỌC SINH</label>
                <input type="text" id="stuName" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ví dụ: Nguyễn Văn An">
            </div>

            <div class="border-2 border-dashed border-blue-400 bg-blue-50/60 rounded-xl p-4 text-center hover:bg-blue-50 transition cursor-pointer">
                <label for="cameraInput" class="cursor-pointer block">
                    <i class="fa-solid fa-camera-retro text-3xl text-blue-600 mb-1"></i>
                    <p class="text-sm font-bold text-blue-700">Chụp ảnh hoặc Chọn từ thư viện</p>
                    <p class="text-xs text-slate-500 mt-0.5">Chụp nhiều trang thoải mái (tự động nén)</p>
                </label>
                <input type="file" id="cameraInput" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)">
            </div>

            <div id="previewBox" class="hidden">
                <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-2">
                    <span>Ảnh đã nén sẵn sàng (<span id="photoCount">0</span>)</span>
                    <button onclick="clearAllPhotos()" class="text-red-500 hover:underline">Xóa hết</button>
                </div>
                <div id="photoGrid" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-slate-50 rounded-lg border"></div>
            </div>

            <button onclick="submitHomework()" id="btnSubmit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition disabled:bg-slate-300">
                NỘP BÀI NGAY
            </button>

            <div id="statusMsg" class="text-center text-xs font-medium min-h-[1.25rem]"></div>
        </div>
    </div>

    <script>
        // THAY BẰNG URL APPS SCRIPT CỦA BẠN[cite: 1]
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnoYmyoxYS15mpMESQ88gu4XudFOeqLm3jlBSs_mGEtZ2Vj8vlyHPDDn1_m90oUgWibg/exec";

        let studentConfigData = [];
        let photoQueue = [];

        function loadStudentConfig() {
            fetch(`${SCRIPT_URL}?action=getStudentConfig`)
                .then(res => res.json())
                .then(res => {
                    if (res.status !== 'success') return;
                    studentConfigData = res.data;
                    const stuClass = document.getElementById('stuClass');
                    stuClass.innerHTML = '<option value="">-- Chọn lớp học --</option>';

                    const uniqueClasses = [...new Set(studentConfigData.map(item => item.className))];
                    uniqueClasses.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        stuClass.appendChild(opt);
                    });
                })
                .catch(err => {
                    document.getElementById('statusMsg').innerHTML = "<span class='text-red-500'>Lỗi tải danh mục lớp!</span>";
                });
        }

        function onClassChange() {
            const selectedClass = document.getElementById('stuClass').value;
            const folderSelect = document.getElementById('stuFolder');
            folderSelect.innerHTML = '<option value="">-- Chọn bài tập cần nộp --</option>';

            const filtered = studentConfigData.filter(i => i.className === selectedClass);
            filtered.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.folderId;
                opt.textContent = item.folderName;
                opt.dataset.foldername = item.folderName;
                folderSelect.appendChild(opt);
            });
        }

        function compressImage(file, maxWidth = 1280, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxWidth) {
                            h = Math.round((h * maxWidth) / w);
                            w = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1] });
                    };
                    img.onerror = err => reject(err);
                };
                reader.onerror = err => reject(err);
            });
        }

        async function handleFileSelect(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerHTML = "<span class='text-blue-500 font-semibold'>Đang tối ưu & nén ảnh...</span>";

            for (let i = 0; i < files.length; i++) {
                const compressed = await compressImage(files[i]);
                photoQueue.push({
                    name: files[i].name || `Trang_${photoQueue.length + 1}.jpg`,
                    base64: compressed.base64,
                    dataUrl: compressed.dataUrl
                });
            }

            document.getElementById('cameraInput').value = "";
            statusMsg.innerText = "";
            renderPhotoGrid();
        }

        function renderPhotoGrid() {
            const box = document.getElementById('previewBox');
            const grid = document.getElementById('photoGrid');
            const count = document.getElementById('photoCount');

            if (photoQueue.length === 0) {
                box.classList.add('hidden');
                return;
            }

            box.classList.remove('hidden');
            count.innerText = photoQueue.length;
            grid.innerHTML = "";

            photoQueue.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "relative rounded border overflow-hidden bg-white shadow-sm";
                div.innerHTML = `
                    <img src="${item.dataUrl}" class="w-full h-20 object-cover">
                    <button onclick="removePhoto(${idx})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">✕</button>
                    <div class="text-[10px] text-center truncate px-1 py-0.5 bg-slate-50">Ảnh ${idx + 1}</div>
                `;
                grid.appendChild(div);
            });
        }

        function removePhoto(idx) {
            photoQueue.splice(idx, 1);
            renderPhotoGrid();
        }

        function clearAllPhotos() {
            photoQueue = [];
            renderPhotoGrid();
        }

        async function submitHomework() {
            const stuClass = document.getElementById('stuClass').value;
            const folderSelect = document.getElementById('stuFolder');
            const folderId = folderSelect.value;
            const folderName = folderSelect.options[folderSelect.selectedIndex]?.dataset.foldername || "";
            const stuName = document.getElementById('stuName').value.trim();
            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('statusMsg');

            if (!stuClass) return alert("Em nhớ chọn Lớp học nhé!");
            if (!folderId) return alert("Em hãy chọn Bài tập cần nộp!");
            if (!stuName) return alert("Em nhớ điền đầy đủ Họ và Tên!");
            if (photoQueue.length === 0) return alert("Em chưa chụp hoặc chọn ảnh bài làm kìa!");

            btn.disabled = true;
            let success = 0;
            const total = photoQueue.length;

            for (let i = 0; i < total; i++) {
                msg.innerHTML = `<span class="text-blue-600 font-semibold">Đang gửi ảnh (${i + 1}/${total})... Vui lòng chờ!</span>`;
                const payload = {
                    action: "submitWork",
                    folderId: folderId,
                    className: stuClass,
                    folderName: folderName,
                    name: stuName,
                    fileName: `Trang_${i + 1}.jpg`,
                    base64Data: photoQueue[i].base64,
                    mimeType: 'image/jpeg'
                };

                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.result === "success") success++;
                } catch (e) {
                    console.error(e);
                }
            }

            if (success === total) {
                msg.innerHTML = `<span class="text-emerald-600 font-bold">✅ Đã nộp thành công toàn bộ ${total} ảnh bài làm!</span>`;
                clearAllPhotos();
                document.getElementById('stuName').value = "";
            } else {
                msg.innerHTML = `<span class="text-amber-600 font-bold">⚠️ Đã gửi được ${success}/${total} ảnh. Em kiểm tra lại nhé!</span>`;
            }
            btn.disabled = false;
        }

        window.onload = loadStudentConfig;
    </script>
</body>
</html>
