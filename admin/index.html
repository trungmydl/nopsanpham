<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vực Quản Trị - Dành Cho Giáo Viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <header class="bg-white border-b shadow-sm sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-chalkboard-user text-blue-600"></i> HỆ THỐNG QUẢN TRỊ BÀI NỘP
            </h1>
            <div id="userInfo" class="hidden items-center gap-3">
                <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full">
                    <i class="fa-solid fa-user-check mr-1"></i> thmy
                </span>
                <button onclick="logoutAdmin()" class="text-xs text-red-600 hover:underline font-semibold">Đăng xuất</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- 1. FORM ĐĂNG NHẬP -->
        <div id="loginCard" class="max-w-sm mx-auto bg-white p-6 rounded-2xl shadow-md border border-slate-200 mt-10">
            <div class="text-center mb-5">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800">Đăng Nhập Giáo Viên</h2>
                <p class="text-xs text-slate-400">Quản lý lớp & bài nộp học sinh</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">TÊN ĐĂNG NHẬP</label>
                    <input type="text" id="username" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="thmy" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">MẬT KHẨU</label>
                    <input type="password" id="password" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnLogin" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition text-sm">
                    ĐĂNG NHẬP
                </button>
                <p id="loginError" class="text-center text-xs text-red-500 font-semibold"></p>
            </form>
        </div>

        <!-- 2. BẢNG ĐIỀU KHIỂN CHÍNH -->
        <div id="adminPanel" class="hidden space-y-6">

            <!-- Thêm lớp và thư mục -->
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-blue-600"></i> Tạo Thư Mục Bài Tập Mới
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="inputClass" list="defaultClasses" placeholder="Tên Lớp (vd: 12B2)" class="border rounded-lg p-2.5 text-sm">
                    <datalist id="defaultClasses">
                        <option value="11B1"></option>
                        <option value="11C1"></option>
                        <option value="11C4"></option>
                        <option value="12A1"></option>
                        <option value="12B2"></option>
                        <option value="12B3"></option>
                    </datalist>
                    <input type="text" id="inputFolder" placeholder="Tên Thư Mục (vd: KTĐG CHƯƠNG I)" class="border rounded-lg p-2.5 text-sm">
                    <button onclick="createNewFolder()" id="btnCreate" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition">
                        <i class="fa-solid fa-plus mr-1"></i> Tạo Thư Mục Trên Drive
                    </button>
                </div>
            </div>

            <!-- Bảng quản lý thư mục: Bật/Ẩn và Xóa hẳn trên Drive -->
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-indigo-600"></i> Quản Lý Thư Mục (Ẩn Học Sinh & Xóa Drive)
                    </h3>
                    <button onclick="fetchAdminData()" class="text-xs text-blue-600 hover:underline">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Làm mới
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b text-slate-600 text-xs">
                                <th class="p-3">Lớp</th>
                                <th class="p-3">Tên Thư Mục</th>
                                <th class="p-3 text-center">Trạng Thái</th>
                                <th class="p-3 text-right">Xóa Thư Mục</th>
                            </tr>
                        </thead>
                        <tbody id="folderTableBody" class="divide-y text-xs sm:text-sm"></tbody>
                    </table>
                </div>
            </div>

            <!-- Bảng danh sách bài nộp của học sinh (Có nút Xóa từng em / Xóa tất cả) -->
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
                    <div class="flex items-center gap-2">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-user-check text-emerald-600"></i> Danh Sách Bài Nộp Của Học Sinh
                        </h3>
                        <span id="logCounter" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold">0 bài</span>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <input type="text" id="filterStudent" onkeyup="renderLogTable()" placeholder="Tìm tên học sinh..." class="border text-xs p-2 rounded-lg outline-none">
                        <select id="filterClassSelect" onchange="renderLogTable()" class="border text-xs p-2 rounded-lg outline-none">
                            <option value="">Tất cả các lớp</option>
                        </select>
                        <button onclick="deleteAllSubmissions()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-bold px-3 py-2 rounded-lg transition flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> Xóa Tất Cả Bài Nộp
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto max-h-[30rem]">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="sticky top-0 bg-slate-50 border-b text-slate-600 text-xs">
                            <tr>
                                <th class="p-3">Thời Gian</th>
                                <th class="p-3">Lớp</th>
                                <th class="p-3">Bài Tập</th>
                                <th class="p-3">Họ và Tên</th>
                                <th class="p-3 text-center">Xem Bài Làm</th>
                                <th class="p-3 text-right">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="divide-y text-xs sm:text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- 3. TRÌNH XEM ẢNH TRỰC TIẾP TRÊN WEB (LIGHTBOX GALLERY) -->
    <div id="imageViewerModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-between p-4">
        <div class="flex justify-between items-center text-white px-2">
            <span id="viewerTitle" class="font-bold text-sm sm:text-base"></span>
            <button onclick="closeViewer()" class="text-white hover:text-red-400 text-2xl px-3 py-1">✕</button>
        </div>

        <div class="relative flex-1 flex items-center justify-center overflow-hidden my-2">
            <img id="viewerImage" src="" class="max-h-full max-w-full object-contain rounded shadow-lg transition-transform duration-200">
            
            <button onclick="prevImage()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl">
                ❮
            </button>
            <button onclick="nextImage()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl">
                ❯
            </button>
        </div>

        <div class="text-center text-white text-xs sm:text-sm">
            <span id="viewerPagination"></span>
        </div>
    </div>

    <script>
        // Dán URL Web App triển khai từ Apps Script của bạn vào đây:
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnoYmyoxYS15mpMESQ88gu4XudFOeqLm3jlBSs_mGEtZ2Vj8vlyHPDDn1_m90oUgWibg/exec";

        let adminToken = sessionStorage.getItem("adminToken") || "";
        let globalConfigs = [];
        let globalLogs = [];

        let currentStudentImages = [];
        let currentImageIndex = 0;

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('loginError');
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerText = "Đang kiểm tra...";

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", username: u, password: p })
                });
                const data = await res.json();
                btn.disabled = false;
                btn.innerText = "ĐĂNG NHẬP";

                if (data.status === 'success') {
                    adminToken = data.token;
                    sessionStorage.setItem("adminToken", adminToken);
                    showDashboard();
                } else {
                    err.innerText = data.message;
                }
            } catch (errExp) {
                btn.disabled = false;
                btn.innerText = "ĐĂNG NHẬP";
                err.innerText = "Lỗi kết nối máy chủ!";
            }
        }

        function showDashboard() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('flex');
            fetchAdminData();
        }

        function logoutAdmin() {
            sessionStorage.removeItem("adminToken");
            location.reload();
        }

        async function fetchAdminData() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminData&token=${encodeURIComponent(adminToken)}&t=${new Date().getTime()}`);
                const data = await res.json();
                if (data.status !== 'success') {
                    alert(data.message);
                    logoutAdmin();
                    return;
                }
                globalConfigs = data.configs;
                globalLogs = data.logs;
                renderFolderTable();
                populateClassFilter();
                renderLogTable();
            } catch (e) {
                alert("Lỗi tải dữ liệu quản trị!");
            }
        }

        function renderFolderTable() {
            const tbody = document.getElementById('folderTableBody');
            tbody.innerHTML = "";

            globalConfigs.forEach(item => {
                const isOpen = item.status === "MO";
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-slate-700">${item.className}</td>
                    <td class="p-3">${item.folderName}</td>
                    <td class="p-3 text-center">
                        <button onclick="toggleFolder(${item.row}, '${item.status}')" class="px-3 py-1 rounded-full text-xs font-bold transition ${isOpen ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}">
                            ${isOpen ? '🟢 Đang mở nộp' : '🔒 Đã tắt ẩn'}
                        </button>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteFolderOnDrive(${item.row}, '${item.folderId}', '${item.className}', '${item.folderName}')" class="text-rose-600 hover:text-white hover:bg-rose-600 font-semibold px-2.5 py-1 rounded border border-rose-200 transition text-xs">
                            <i class="fa-solid fa-trash-can mr-1"></i> Xóa Drive
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function populateClassFilter() {
            const select = document.getElementById('filterClassSelect');
            select.innerHTML = '<option value="">Tất cả các lớp</option>';
            const unique = [...new Set(globalConfigs.map(c => c.className))];
            unique.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.textContent = c;
                select.appendChild(opt);
            });
        }

        function renderLogTable() {
            const q = document.getElementById('filterStudent').value.toLowerCase();
            const cls = document.getElementById('filterClassSelect').value;
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = "";

            const filtered = globalLogs.filter(row => {
                const matchName = String(row.studentName).toLowerCase().includes(q);
                const matchClass = cls === "" || row.className === cls;
                return matchName && matchClass;
            });

            document.getElementById('logCounter').innerText = `${filtered.length} bài`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-5 text-center text-slate-400">Không có bài nộp nào (hoặc các bài nộp đã bị ẩn)</td></tr>`;
                return;
            }

            filtered.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 text-slate-500 text-xs">${row.time}</td>
                    <td class="p-3 font-bold text-blue-700">${row.className}</td>
                    <td class="p-3 text-slate-600">${row.folderName}</td>
                    <td class="p-3 font-bold text-slate-800">${row.studentName}</td>
                    <td class="p-3 text-center">
                        <button onclick="openViewer(${idx})" class="inline-flex items-center gap-1 px-3 py-1 bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white rounded-lg font-bold text-xs transition">
                            <i class="fa-solid fa-images"></i> Xem Bài (${row.fileCount} ảnh)
                        </button>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteSingleStudent(${row.row}, ${JSON.stringify(row.images).replace(/"/g, '&quot;')}, '${row.studentName}')" class="text-slate-400 hover:text-rose-600 text-xs p-1" title="Xóa bài học sinh này">
                            <i class="fa-regular fa-trash-can"></i> Xóa
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ================= LIGHTBOX XEM ẢNH =================
        function openViewer(logIdx) {
            const logItem = globalLogs[logIdx];
            if (!logItem.images || logItem.images.length === 0) return alert("Không có ảnh nào!");

            currentStudentImages = logItem.images;
            currentImageIndex = 0;
            const title = `${logItem.studentName} - Lớp ${logItem.className} (${logItem.folderName})`;

            document.getElementById('viewerTitle').innerText = title;
            document.getElementById('imageViewerModal').classList.remove('hidden');
            updateViewerImage();
        }

        function updateViewerImage() {
            const fileId = currentStudentImages[currentImageIndex];
            document.getElementById('viewerImage').src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1600`;
            document.getElementById('viewerPagination').innerText = `Ảnh ${currentImageIndex + 1} / ${currentStudentImages.length} (Bấm mũi tên để lướt qua lại)`;
        }

        function prevImage() {
            if (currentImageIndex > 0) {
                currentImageIndex--;
                updateViewerImage();
            }
        }

        function nextImage() {
            if (currentImageIndex < currentStudentImages.length - 1) {
                currentImageIndex++;
                updateViewerImage();
            }
        }

        function closeViewer() {
            document.getElementById('imageViewerModal').classList.add('hidden');
            document.getElementById('viewerImage').src = "";
        }

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('imageViewerModal').classList.contains('hidden')) return;
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'Escape') closeViewer();
        });

        // ================= CÁC THAO TÁC XÓA & QUẢN TRỊ =================
        async function createNewFolder() {
            const cName = document.getElementById('inputClass').value.trim();
            const fName = document.getElementById('inputFolder').value.trim();
            if (!cName || !fName) return alert("Vui lòng nhập đầy đủ Lớp và Thư mục!");

            const btn = document.getElementById('btnCreate');
            btn.disabled = true;
            btn.innerText = "Đang tạo trên Drive...";

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "createFolder", token: adminToken, className: cName, folderName: fName })
                });
                const data = await res.json();
                btn.disabled = false;
                btn.innerText = "Tạo Thư Mục Trên Drive";
                alert(data.message);
                document.getElementById('inputFolder').value = "";
                fetchAdminData();
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "Tạo Thư Mục Trên Drive";
                alert("Lỗi khi tạo thư mục!");
            }
        }

        // Bật / Ẩn thư mục (Khi Ẩn: học sinh không thể nộp và bảng nộp bài của học sinh foder đó cũng ẩn theo)
        async function toggleFolder(row, curStatus) {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "toggleStatus", token: adminToken, row: row, currentStatus: curStatus })
            });
            fetchAdminData();
        }

        // Xóa thư mục trên Drive
        async function deleteFolderOnDrive(row, folderId, cName, fName) {
            if (!confirm(`CẢNH BÁO: Bạn có chắc chắn muốn XÓA HẲN thư mục "${fName}" của lớp ${cName} trên Google Drive không?\n(Mọi file bài làm trong thư mục này sẽ bị đưa vào thùng rác)`)) return;

            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteFolderAndDrive", token: adminToken, row: row, folderId: folderId })
            });
            fetchAdminData();
        }

        // Xóa bài nộp của 1 học sinh
        async function deleteSingleStudent(row, images, studentName) {
            if (!confirm(`Bạn có chắc chắn muốn xóa bài nộp và toàn bộ ảnh của em: "${studentName}" không?`)) return;

            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteSingleSubmission", token: adminToken, row: row, images: images })
            });
            fetchAdminData();
        }

        // Xóa tất cả bài nộp
        async function deleteAllSubmissions() {
            if (!confirm("NGUY HIỂM: Bạn có chắc chắn muốn XÓA TOÀN BỘ bài nộp của tất cả học sinh không?\n(Toàn bộ ảnh trên Google Drive sẽ được chuyển vào thùng rác để làm trống hệ thống)")) return;

            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteAllSubmissions", token: adminToken })
            });
            fetchAdminData();
        }

        window.onload = function() {
            if (adminToken) {
                showDashboard();
            }
        };
    </script>
</body>
</html>
