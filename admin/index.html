<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vực Quản Trị - Dành Cho Giáo Viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <header class="bg-white border-b shadow-sm sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-chalkboard-user text-blue-600"></i> HỆ THỐNG QUẢN TRỊ BÀI NỘP
            </h1>
            <div id="userInfo" class="hidden items-center gap-3">
                <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full">
                    <i class="fa-solid fa-user-check mr-1"></i> thmy
                </span>
                <button onclick="logoutAdmin()" class="text-xs text-red-600 hover:underline font-semibold">Đăng xuất</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- 1. FORM ĐĂNG NHẬP -->
        <div id="loginCard" class="max-w-sm mx-auto bg-white p-6 rounded-2xl shadow-md border border-slate-200 mt-10">
            <div class="text-center mb-5">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800">Đăng Nhập Giáo Viên</h2>
                <p class="text-xs text-slate-400">Quản lý lớp & theo dõi bài nộp</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">TÊN ĐĂNG NHẬP</label>
                    <input type="text" id="username" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="thmy" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">MẬT KHẨU</label>
                    <input type="password" id="password" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnLogin" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition text-sm">
                    ĐĂNG NHẬP
                </button>
                <p id="loginError" class="text-center text-xs text-red-500 font-semibold"></p>
            </form>
        </div>

        <!-- 2. BẢNG ĐIỀU KHIỂN CHÍNH -->
        <div id="adminPanel" class="hidden space-y-6">

            <!-- Thêm lớp và thư mục -->
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-blue-600"></i> Tạo Thư Mục Bài Tập Mới
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="inputClass" list="defaultClasses" placeholder="Tên Lớp (vd: LỚP 11B1)" class="border rounded-lg p-2.5 text-sm">
                    <datalist id="defaultClasses">
                        <option value="LỚP 11B1"></option>
                        <option value="LỚP 11C1"></option>
                        <option value="LỚP 11C4"></option>
                        <option value="LỚP 12A1"></option>
                        <option value="LỚP 12B3"></option>
                    </datalist>
                    <input type="text" id="inputFolder" placeholder="Tên Thư Mục (vd: Ôn tập chương 1)" class="border rounded-lg p-2.5 text-sm">
                    <button onclick="createNewFolder()" id="btnCreate" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition">
                        <i class="fa-solid fa-plus mr-1"></i> Tạo Thư Mục Trên Drive
                    </button>
                </div>
            </div>

            <!-- Bảng bật/tắt nhận bài & xóa thư mục -->
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-indigo-600"></i> Quản Lý Thư Mục (Bật/Tắt Nhận Bài)
                    </h3>
                    <button onclick="fetchAdminData()" class="text-xs text-blue-600 hover:underline">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Làm mới
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b text-slate-600 text-xs">
                                <th class="p-3">Lớp</th>
                                <th class="p-3">Tên Thư Mục</th>
                                <th class="p-3 text-center">Trạng Thái</th>
                                <th class="p-3 text-right">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="folderTableBody" class="divide-y text-xs sm:text-sm"></tbody>
                    </table>
                </div>
            </div>

            <!-- Bảng danh sách bài nộp và xem ảnh -->
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-user-check text-emerald-600"></i> Danh Sách Bài Nộp Của Học Sinh
                    </h3>
                    <div class="flex gap-2">
                        <input type="text" id="filterStudent" onkeyup="renderLogTable()" placeholder="Tìm tên học sinh..." class="border text-xs p-2 rounded-lg outline-none">
                        <select id="filterClassSelect" onchange="renderLogTable()" class="border text-xs p-2 rounded-lg outline-none">
                            <option value="">Tất cả các lớp</option>
                        </select>
                    </div>
                </div>

                <div class="overflow-x-auto max-h-[30rem]">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="sticky top-0 bg-slate-50 border-b text-slate-600 text-xs">
                            <tr>
                                <th class="p-3">Thời Gian</th>
                                <th class="p-3">Lớp</th>
                                <th class="p-3">Bài Tập</th>
                                <th class="p-3">Họ và Tên</th>
                                <th class="p-3 text-center">Xem Bài Làm</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="divide-y text-xs sm:text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // THAY BẰNG URL APPS SCRIPT CỦA BẠN[cite: 1]
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnoYmyoxYS15mpMESQ88gu4XudFOeqLm3jlBSs_mGEtZ2Vj8vlyHPDDn1_m90oUgWibg/exec";

        let adminToken = sessionStorage.getItem("adminToken") || "";
        let globalConfigs = [];
        let globalLogs = [];

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('loginError');
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerText = "Đang kiểm tra...";

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", username: u, password: p })
                });
                const data = await res.json();
                btn.disabled = false;
                btn.innerText = "ĐĂNG NHẬP";

                if (data.status === 'success') {
                    adminToken = data.token;
                    sessionStorage.setItem("adminToken", adminToken);
                    showDashboard();
                } else {
                    err.innerText = data.message;
                }
            } catch (errExp) {
                btn.disabled = false;
                btn.innerText = "ĐĂNG NHẬP";
                err.innerText = "Lỗi kết nối máy chủ!";
            }
        }

        function showDashboard() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('flex');
            fetchAdminData();
        }

        function logoutAdmin() {
            sessionStorage.removeItem("adminToken");
            location.reload();
        }

        async function fetchAdminData() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminData&token=${encodeURIComponent(adminToken)}`);
                const data = await res.json();
                if (data.status !== 'success') {
                    alert(data.message);
                    logoutAdmin();
                    return;
                }
                globalConfigs = data.configs;
                globalLogs = data.logs;
                renderFolderTable();
                populateClassFilter();
                renderLogTable();
            } catch (e) {
                alert("Lỗi tải dữ liệu quản trị!");
            }
        }

        function renderFolderTable() {
            const tbody = document.getElementById('folderTableBody');
            tbody.innerHTML = "";

            globalConfigs.forEach(item => {
                const isOpen = item.status === "MO";
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-slate-700">${item.className}</td>
                    <td class="p-3">${item.folderName}</td>
                    <td class="p-3 text-center">
                        <button onclick="toggleFolder(${item.row}, '${item.status}')" class="px-3 py-1 rounded-full text-xs font-bold ${isOpen ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}">
                            ${isOpen ? '🟢 Đang mở nộp' : '🔒 Đã tắt ẩn'}
                        </button>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteFolder(${item.row})" class="text-rose-500 hover:text-rose-700 font-semibold px-2 py-1 rounded border border-rose-200 hover:bg-rose-50">
                            <i class="fa-regular fa-trash-can mr-1"></i> Xóa
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function populateClassFilter() {
            const select = document.getElementById('filterClassSelect');
            select.innerHTML = '<option value="">Tất cả các lớp</option>';
            const unique = [...new Set(globalConfigs.map(c => c.className))];
            unique.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.textContent = c;
                select.appendChild(opt);
            });
        }

        function renderLogTable() {
            const q = document.getElementById('filterStudent').value.toLowerCase();
            const cls = document.getElementById('filterClassSelect').value;
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = "";

            const filtered = globalLogs.filter(row => {
                const matchName = row.studentName.toLowerCase().includes(q);
                const matchClass = cls === "" || row.className === cls;
                return matchName && matchClass;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Không có bài nộp nào phù hợp</td></tr>`;
                return;
            }

            filtered.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 text-slate-500">${row.time}</td>
                    <td class="p-3 font-semibold text-blue-700">${row.className}</td>
                    <td class="p-3 text-slate-600">${row.folderName}</td>
                    <td class="p-3 font-bold text-slate-800">${row.studentName}</td>
                    <td class="p-3 text-center">
                        <a href="${row.fileUrl}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white rounded-lg font-bold transition">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Xem Ảnh
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function createNewFolder() {
            const cName = document.getElementById('inputClass').value.trim();
            const fName = document.getElementById('inputFolder').value.trim();
            if (!cName || !fName) return alert("Vui lòng nhập đầy đủ Lớp và Thư mục!");

            const btn = document.getElementById('btnCreate');
            btn.disabled = true;
            btn.innerText = "Đang tạo trên Drive...";

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "createFolder", token: adminToken, className: cName, folderName: fName })
                });
                const data = await res.json();
                btn.disabled = false;
                btn.innerText = "Tạo Thư Mục Trên Drive";
                alert(data.message);
                document.getElementById('inputFolder').value = "";
                fetchAdminData();
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "Tạo Thư Mục Trên Drive";
                alert("Lỗi khi tạo thư mục!");
            }
        }

        async function toggleFolder(row, curStatus) {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "toggleStatus", token: adminToken, row: row, currentStatus: curStatus })
            });
            fetchAdminData();
        }

        async function deleteFolder(row) {
            if (!confirm("Bạn có chắc chắn muốn xóa thư mục này khỏi danh sách nhận bài? (Ảnh trên Drive vẫn an toàn)")) return;
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteConfig", token: adminToken, row: row })
            });
            fetchAdminData();
        }

        window.onload = function() {
            if (adminToken) {
                showDashboard();
            }
        };
    </script>
</body>
</html>
